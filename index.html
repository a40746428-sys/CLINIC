<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة المسالك البولية — ClinicFlow Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>عيادة المسالك البولية</h1>
      <p>د. لعيايدة اليزيد · ClinicFlow Pro</p>
    </div>
    <div class="status">النظام يعمل محليًا · Prototype</div>
  </header>

  <nav class="nav" id="nav">
    <button data-view="dashboard" class="active">🏠 لوحة التحكم</button>
    <button data-view="doctor">👨‍⚕️ الطبيب</button>
    <button data-view="reception">➕ الاستقبال</button>
    <button data-view="triage">🔀 الترياج / الفرز</button>
    <button data-view="patients">👥 ملفات المرضى</button>
    <button data-view="appointments">📅 المواعيد</button>
    <button data-view="waiting">📺 شاشة الانتظار</button>
  </nav>

  <main id="app"></main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
